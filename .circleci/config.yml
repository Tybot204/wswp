version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.14
  
  node-postgres:
    docker:
      - image: cimg/node:22.14
      - image: cimg/postgres:16.8
        environment:
          POSTGRES_DB: wswp

jobs:
  build:
    executor: node
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Build Project for Production
          command: yarn build
          environment:
            NODE_ENV: production

      - persist_to_workspace:
          root: .
          paths:
            - build

  install-dependencies:
    executor: node-postgres
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-node-deps-{{ checksum "package.json" }}-{{ checksum "yarn.lock" }}-{{ checksum "prisma/schema.prisma" }}
            - v1-node-deps-{{ checksum "package.json" }}-{{ checksum "yarn.lock" }}
            - v1-node-deps-{{ checksum "package.json" }}
            - v1-node-deps

      - run:
          name: Install Node Dependencies
          command: yarn

      - run:
          name: Generate Prisma Types
          command: yarn prisma generate

      - run:
          name: Generate Prisma SQL Types
          command: yarn prisma generate --sql

      - save_cache:
          key: v1-node-deps-{{ checksum "package.json" }}-{{ checksum "yarn.lock" }}-{{ checksum "prisma/schema.prisma" }}
          paths:
            - node_modules

      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    executor: node
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Lint Project
          command: yarn lint

workflows:
  build-lint:
    jobs:
      - install-dependencies:
          filters:
            tags:
              only: /.*/

      - build:
          requires:
            - install-dependencies
          filters:
            tags:
              only: /.*/

      - lint:
          requires:
            - install-dependencies
          filters:
            tags:
              only: /.*/
