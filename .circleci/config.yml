version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.12
  
  node-postgres:
    docker:
      - image: cimg/node:24.12
      - image: cimg/postgres:18.0
        environment:
          POSTGRES_DB: wswp

jobs:
  build:
    executor: node
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Build Project for Production
          command: pnpm build
          environment:
            NODE_ENV: production

      - persist_to_workspace:
          root: .
          paths:
            - build

  install-dependencies:
    executor: node-postgres
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-node-deps-{{ checksum "package.json" }}-{{ checksum "pnpm-lock.yaml" }}
            - v1-node-deps-{{ checksum "package.json" }}
            - v1-node-deps

      - run:
          name: Install Node Dependencies
          command: pnpm install

      - run:
          name: Sync Database and Generate Prisma Types
          command: pnpm dev:setup

      - save_cache:
          key: v1-node-deps-{{ checksum "package.json" }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules

      - persist_to_workspace:
          root: .
          paths:
            - generated
            - node_modules

  lint:
    executor: node
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Lint Project
          command: pnpm lint

workflows:
  build-lint:
    jobs:
      - install-dependencies:
          filters:
            tags:
              only: /.*/

      - build:
          requires:
            - install-dependencies
          filters:
            tags:
              only: /.*/

      - lint:
          requires:
            - install-dependencies
          filters:
            tags:
              only: /.*/
